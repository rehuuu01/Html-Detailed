<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered-list</title>
</head>
<body>
    <h1>Ordered List</h1>
    <ol type="1">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ol>
    <ol type="A">
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ol>
    <ol type="I">
        <li>Subjects</li>
            <ol type="i"><li>Math</li>
            <li>Science</li>
            <li>English</li></ol>
        
    </ol>
</body>
</html>
