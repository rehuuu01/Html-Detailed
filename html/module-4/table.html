<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tag</title>
</head>
<body>
    <table border="2">
        <caption>Product Inventory</caption>
        <tr>
            <th colspan="4">Product Details</th>
        </tr>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Quality</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Wheat</td>
            <td>Good</td>
            <td>200 bags</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Rice</td>
            <td>Good</td>
            <td>250 bags</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Maize</td>
            <td>Good</td>
            <td>300 bags</td>

    </table>
    
</body>
</html>
